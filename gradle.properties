# Important Notes:
# Every field you add must be added to the buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=1.0.2
group=kz.dosyakitarov.nomadsdelight
java_version=21

# Common
minecraft_version=1.21.1
mod_name=Nomad's Delight
mod_author=DosyaKitare, Ninsent
mod_id=nomads_delight
license=MIT License
credits=
description=Bringing the hearty culinary traditions of the steppe nomads to your Farmer's Delight kitchen.
minecraft_version_range=[1.21.1, 1.22)
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.1-20240808.144430
# The version of ParchmentMC that is used, see https://parchmentmc.org/docs/getting-started#choose-a-version for new versions
parchment_minecraft=1.21
parchment_version=2024.11.10

# Dependencies
## JEI (https://maven.blamejared.com) - optional integration, plugin lives in common
jei_version=19.27.0.343
## Original Farmer's Delight, used by the NeoForge module (CurseMaven)
farmersdelight_neoforge=curse.maven:farmers-delight-398521:7801529
farmersdelight_version_range=[1.2,)
## Farmer's Delight Refabricated, used by the Fabric module (https://maven.cassian.cc)
## Same mod id ("farmersdelight"), packages and registry names as the original.
fdrf_version=1.21.1-3.3.3+refabricated

# Fabric (loader >=0.19 required by Farmer's Delight Refabricated's ClassTweaker)
fabric_version=0.116.15+1.21.1
fabric_loader_version=0.19.3

# NeoForge
neoforge_version=21.1.228
neoforge_loader_version_range=[4,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
